name: Lab quality
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  lab-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      python: ${{ steps.plan.outputs.python }}
      javascript: ${{ steps.plan.outputs.javascript }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Record actual checkout and PR identities
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git rev-parse HEAD
          node -e 'console.log(JSON.stringify({head:process.env.PR_HEAD || null,base:process.env.PR_BASE || null}))'
      - name: Select checks from changed paths
        id: plan
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check.mjs --ci-plan "$DIFF_BASE" >> "$GITHUB_OUTPUT"
      - run: node scripts/check.mjs
      - name: Lint workflow syntax, expressions and shell steps
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/quality.yml
  lab-python:
    needs: [lab-system]
    if: needs.lab-system.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check scripts tests examples/group-reduction
      - run: python -m ruff format --check scripts tests examples/group-reduction
      - run: python -m mypy
      - name: Run regressions; reject zero tests and skips
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun >= 16 and not result.skipped, 'Missing or skipped regressions'
          PY
  lab-javascript:
    needs: [lab-system]
    if: needs.lab-system.outputs.javascript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node scripts/check.mjs --self-test
  lab-rust:
    needs: [lab-system]
    if: needs.lab-system.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the upstream toolchain
        run: rustup toolchain install nightly-2026-05-01 --profile minimal --component rustfmt,clippy
      - name: Parse and format SDK tests; compile/lint/test only the independent reference
        run: |
          rustup run nightly-2026-05-01 rustc --version --verbose
          rustup run nightly-2026-05-01 rustfmt --edition 2024 --config max_width=120 --check examples/furiosa-double-buffering/tests/double_buffering_tests.rs
          rustup run nightly-2026-05-01 clippy-driver --edition=2024 --test examples/furiosa-double-buffering/tests/support/double_buffering_reference.rs -D warnings -o "$RUNNER_TEMP/reference-tests"
          status=0
          "$RUNNER_TEMP/reference-tests" > "$RUNNER_TEMP/reference-result.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/reference-result.txt"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          grep -E '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' "$RUNNER_TEMP/reference-result.txt"
      - name: Obtain the exact public patch target, without native SDK installation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: furiosa-ai/furiosa-opt
          ref: 9b9cf0fdc78df00cdc430eae725a5ad9084a735e
          path: .local/upstream
          persist-credentials: false
      - name: Check public patches against the pinned source
        working-directory: .local/upstream
        run: |
          git apply --check ../../examples/furiosa-double-buffering/controls/reuse-first-trf.patch
          git apply --check ../../examples/furiosa-mapping-parser/tests.patch
          git apply --check ../../examples/furiosa-mapping-parser/controls/accept-bracket-extent.patch
  lab-ci:
    needs: [lab-system, lab-python, lab-javascript, lab-rust]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require every selected check to succeed
        env:
          CI_PLAN: ${{ toJSON(needs.lab-system.outputs) }}
          CI_RESULTS: >-
            {"system":"${{ needs.lab-system.result }}","python":"${{ needs.lab-python.result }}","javascript":"${{ needs.lab-javascript.result }}","rust":"${{ needs.lab-rust.result }}"}
        run: node scripts/check.mjs --ci-gate
  publish-report:
    needs: [lab-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}report.pdf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stage only the reviewed PDF
        run: |
          mkdir "$RUNNER_TEMP/report-site"
          cp report.pdf "$RUNNER_TEMP/report-site/report.pdf"
          sha256sum "$RUNNER_TEMP/report-site/report.pdf"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/report-site
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
